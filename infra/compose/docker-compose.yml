# Developer profile (blueprint p.8): local dev + demos. Ports are offset to avoid clashing with other local stacks.
name: vprocly

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vprocly_admin
      POSTGRES_PASSWORD: vprocly_admin
      POSTGRES_DB: vprocly
    ports: ["55432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vprocly_admin -d vprocly"]
      interval: 5s
      retries: 20

  # Any S3-compatible store works (MinIO, Ceph, AWS S3). SeaweedFS is used locally because MinIO no longer
  # publishes community images. The app creates its buckets at startup.
  s3:
    image: chrislusf/seaweedfs:latest
    # Explicit volume limits: each bucket needs its own volumes, and the auto limit derived from free disk
    # is too low on small hosts (CI runners), which makes writes to a second bucket fail with InternalError.
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=100", "-master.volumeSizeLimitMB=256",
              "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["58333:8333"]
    volumes:
      - s3_data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 port opens before storage is writable; wait until the master reports a volume server.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/dir/status | grep -q '\"DataNodes\":\\[{'"]
      interval: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # Issuer is always the public URL; token/JWKS endpoints also answer on internal hostnames
      # (e.g. host.docker.internal from the kind cluster).
      KC_HOSTNAME: http://localhost:58080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["58080:8080"]
    volumes:
      - ./keycloak/vprocly-realm.json:/opt/keycloak/data/import/vprocly-realm.json:ro

  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["54222:4222", "58222:8222"]
    volumes: [nats_data:/data]

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    user: "0"   # the named volume is root-owned; dev only
    ports: ["57233:7233", "58233:8233"]
    volumes: [temporal_data:/data]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]

  # Scans every upload before it leaves quarantine. First start downloads signatures (a few minutes).
  clamav:
    image: clamav/clamav-debian:stable   # official image; this variant is multi-arch (arm64 + amd64)
    ports: ["53310:3310"]
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 300s

  mailpit:
    image: axllent/mailpit:latest
    ports: ["51025:1025", "58025:8025"]

volumes:
  pg_data:
  s3_data:
  nats_data:
  temporal_data:
  clamav_data:
