{{- if .Values.networkPolicy.enabled }}
# The Excel service parses untrusted files: only the api and worker may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vprocly.fullname" . }}-excel
  labels: {{- include "vprocly.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "vprocly.selector" (dict "root" . "component" "excel") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [api, worker] }
      ports:
        - { port: 8001 }
  egress: []
{{- end }}
