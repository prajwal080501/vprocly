apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vprocly.fullname" . }}-config
  labels: {{- include "vprocly.labels" . | nindent 4 }}
data:
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.oidcClientId | quote }}
  {{- with .Values.config.oidcInternalIssuer }}
  OIDC_INTERNAL_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.oidcJwksUri }}
  OIDC_JWKS_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.s3Endpoint }}
  S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_BUCKET_DOCUMENTS: {{ .Values.config.s3BucketDocuments | quote }}
  S3_BUCKET_QUARANTINE: {{ .Values.config.s3BucketQuarantine | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  CLAMAV_HOST: {{ .Values.config.clamavHost | quote }}
  CLAMAV_PORT: {{ .Values.config.clamavPort | quote }}
  TEMPORAL_ADDRESS: {{ .Values.config.temporalAddress | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.config.temporalNamespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.config.temporalTaskQueue | quote }}
  UPLOAD_DEADLINE_SECONDS: {{ .Values.config.uploadDeadlineSeconds | quote }}
  CORS_ORIGIN: {{ .Values.config.publicUrl | quote }}
  NEXTAUTH_URL: {{ .Values.config.publicUrl | quote }}
  # Used to build supplier invite links in emails -- must be the real public URL, not the code's
  # localhost default, or invite links sent in production would be unusable.
  PUBLIC_WEB_URL: {{ .Values.config.publicUrl | quote }}
  PUBLIC_API_URL: {{ .Values.config.publicUrl | quote }}
  API_URL: "http://{{ include "vprocly.fullname" . }}-api:4000/api"
  EXCEL_SERVICE_URL: "http://{{ include "vprocly.fullname" . }}-excel:8001"
  {{- with .Values.config.s3ExcelEndpoint }}
  S3_EXCEL_ENDPOINT: {{ . | quote }}
  {{- end }}
  KEYCLOAK_ADMIN_URL: {{ .Values.config.keycloakAdminUrl | quote }}
  KEYCLOAK_ADMIN_CLIENT_ID: {{ .Values.config.keycloakAdminClientId | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_FROM: {{ .Values.config.smtpFrom | quote }}
  NOREPLY_SMTP_HOST: {{ .Values.config.smtpNoreplyHost | quote }}
  NOREPLY_SMTP_PORT: {{ .Values.config.smtpNoreplyPort | quote }}
  NOREPLY_SMTP_FROM: {{ .Values.config.smtpNoreplyFrom | quote }}
  EMAIL_DELIVERY_MODE: {{ .Values.config.emailDeliveryMode | quote }}
  VOICE_DELIVERY_MODE: {{ .Values.config.voiceDeliveryMode | quote }}
  {{- with .Values.config.sarvamOrgId }}
  SARVAM_ORG_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sarvamWorkspaceId }}
  SARVAM_WORKSPACE_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sarvamAppId }}
  SARVAM_APP_ID: {{ . | quote }}
  {{- end }}
  SARVAM_APP_VERSION: {{ .Values.config.sarvamAppVersion | quote }}
  {{- with .Values.config.sarvamConnectionId }}
  SARVAM_CONNECTION_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sarvamAgentPhoneNumber }}
  SARVAM_AGENT_PHONE_NUMBER: {{ . | quote }}
  {{- end }}
