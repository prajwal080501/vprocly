{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vprocly.fullname" . }}
  labels: {{- include "vprocly.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # NextAuth's routes live in the web app; the more specific prefix wins over /api.
          - path: /api/auth
            pathType: Prefix
            backend: { service: { name: {{ include "vprocly.fullname" . }}-web, port: { name: http } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ include "vprocly.fullname" . }}-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "vprocly.fullname" . }}-web, port: { name: http } } }
{{- end }}
