{{- if .Values.migrations.enabled }}
# Runs schema migrations with the owner role before install/upgrade. The app role never owns tables.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vprocly.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "vprocly.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      {{- include "vprocly.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "vprocly.image" (dict "root" . "name" "api") }}
          {{- include "vprocly.containerSecurity" . | nindent 10 }}
          command: ["node", "node_modules/@vprocly/db/dist/migrate.js"]
          env:
            - name: DATABASE_ADMIN_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DATABASE_ADMIN_URL } }
{{- end }}
