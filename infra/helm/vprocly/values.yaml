# External services are referenced, not bundled: SaaS points at managed Postgres/S3/Keycloak/NATS/Temporal;
# on-prem profiles (v3) add optional subcharts for them.

image:
  registry: ghcr.io/vprocly
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  publicUrl: https://app.example.com           # browser-facing URL of the web app
  oidcIssuer: https://id.example.com/realms/vprocly
  oidcAudience: vprocly-api
  oidcClientId: vprocly-web
  # Optional internal URLs when the public issuer is not reachable from inside the cluster.
  oidcInternalIssuer: ""
  oidcJwksUri: ""
  s3Endpoint: ""                               # empty = AWS S3; set for SeaweedFS/MinIO/Ceph
  s3Region: ap-south-1
  s3BucketDocuments: vprocly-documents
  s3BucketQuarantine: vprocly-quarantine
  natsUrl: nats://nats:4222
  clamavHost: clamav
  clamavPort: 3310
  temporalAddress: temporal-frontend:7233     # Temporal Cloud: <ns>.<acct>.tmprl.cloud:7233
  temporalNamespace: default
  temporalTaskQueue: vprocly-platform
  uploadDeadlineSeconds: 3600
  # A confidential service-account client scoped to realm-management:manage-users within oidcIssuer's realm
  # only (see infra/compose/keycloak/vprocly-realm.json: "vprocly-admin-api"), used to create supplier
  # logins for the sourcing marketplace. Its secret goes in existingSecret, not here.
  keycloakAdminUrl: https://id.example.com
  keycloakAdminClientId: vprocly-admin-api
  # Only needed if the Excel service cannot reach s3Endpoint directly (e.g. it resolves differently for a
  # containerized service than for this API) -- see S3_EXCEL_ENDPOINT in object-storage.service.ts.
  s3ExcelEndpoint: ""

# Secret must provide: DATABASE_URL (app role), DATABASE_ADMIN_URL (migrations/owner role), S3_ACCESS_KEY,
# S3_SECRET_KEY, NEXTAUTH_SECRET, OIDC_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET. Manage it with External
# Secrets / Vault.
existingSecret: vprocly-secrets

migrations:
  enabled: true

api:
  replicas: 2
  resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { memory: 768Mi } }
web:
  replicas: 2
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 512Mi } }
worker:
  replicas: 1
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
excel:
  replicas: 1
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }

ingress:
  enabled: true
  className: traefik
  host: app.example.com
  tlsSecretName: ""
  annotations: {}

networkPolicy:
  enabled: true
